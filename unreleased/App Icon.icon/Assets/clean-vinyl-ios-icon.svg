<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Clean vinyl record</title>
  <desc id="desc">A perfectly circular black vinyl record with subtle grooves, a white center label, and a small spindle hole on a transparent background.</desc>

  <defs>
    <radialGradient id="vinyl" cx="42%" cy="36%" r="72%">
      <stop offset="0" stop-color="#34353a"/>
      <stop offset="0.42" stop-color="#17181c"/>
      <stop offset="0.78" stop-color="#0b0c0f"/>
      <stop offset="1" stop-color="#050608"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="0.54" stop-color="#ffffff" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="label" cx="38%" cy="32%" r="76%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ec"/>
    </radialGradient>

    <clipPath id="discClip">
      <circle cx="512" cy="512" r="448"/>
    </clipPath>
  </defs>

  <!-- Record body -->
  <circle cx="512" cy="512" r="448" fill="url(#vinyl)"/>
  <circle cx="512" cy="512" r="446.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

  <!-- Simplified grooves: sparse enough to remain crisp at app-icon sizes -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.065" stroke-width="2">
    <circle cx="512" cy="512" r="406"/>
    <circle cx="512" cy="512" r="378"/>
    <circle cx="512" cy="512" r="350"/>
    <circle cx="512" cy="512" r="322"/>
    <circle cx="512" cy="512" r="294"/>
    <circle cx="512" cy="512" r="266"/>
    <circle cx="512" cy="512" r="238"/>
    <circle cx="512" cy="512" r="210"/>
  </g>
  <g fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="2">
    <circle cx="512" cy="512" r="392"/>
    <circle cx="512" cy="512" r="364"/>
    <circle cx="512" cy="512" r="336"/>
    <circle cx="512" cy="512" r="308"/>
    <circle cx="512" cy="512" r="280"/>
    <circle cx="512" cy="512" r="252"/>
    <circle cx="512" cy="512" r="224"/>
  </g>

  <!-- Soft diagonal light reflection, clipped to the disc -->
  <g clip-path="url(#discClip)" opacity="0.8">
    <path d="M72 262 L238 96 L952 810 L786 976 Z" fill="url(#sheen)"/>
  </g>

  <!-- Center label -->
  <circle cx="512" cy="512" r="152" fill="#000000" fill-opacity="0.28"/>
  <circle cx="512" cy="512" r="140" fill="url(#label)"/>
  <circle cx="512" cy="512" r="138.5" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
  <circle cx="512" cy="512" r="20" fill="#111216"/>
  <circle cx="506" cy="506" r="5" fill="#ffffff" fill-opacity="0.18"/>
</svg>
